name: Build workflow-testing

on:
  push:
    branches:
      - "**"
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-jsp-env:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scikit-decide and test dependencies
        run: |
          pip install pytest
      - name: test importing it
        run: |
          mkdir tests
          pytest tests/
  test-jsp-env-wrapped:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scikit-decide and test dependencies
        run: |
          pip install pytest
      - name: test importing it
        run: |
          mkdir tests
          sh -c 'pytest tests/ ; ret=$?; [ $ret = 5 ] && exit 0 || exit $ret'
