name: Build workflow-testing

on:
  push:
    branches:
      - "**"
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-archi:
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
        os: ["macos-latest", "windows-latest", "ubuntu-latest"]
        backend: [ "tf", "torch", "jax" ]
        autolirpa : [ "", "autolirpa" ]
        exclude:
          - backend: "tf"
            autolirpa: true
          - backend: "jax"
            autolirpa: true
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:

      - name: Pick proper tox env
        shell: python
        run: | 
          toxenv="${{ matrix.python-version }}-${{ matrix.os }}-${{ matrix.backend }}"
          print(${{ matrix.autolirpa }})
          if "${{ matrix.autolirpa }}" == "autolirpa":
              toxenv += "-autolirpa"
          print($toxenv)
          

          
